name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  back:
    name: Back service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: back-service/package-lock.json
      - name: Cache MongoDB binaries (mongodb-memory-server)
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('back-service/package-lock.json') }}
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests (unit, integration, contract)
        run: npm test
      - name: Migrations up → down → up
        run: npm run migrate:check

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test -- --ci

  front:
    name: Front service (nginx -t)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: nginx -t
        run: docker compose -f infra/docker-compose.dev.yml run --rm --no-deps nginx nginx -t
