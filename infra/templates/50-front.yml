AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  junte - ALB publico con HTTPS, Nginx en EC2 y registro api.<zona> (S1-INF-10; paso 1.9 del
  plan). 443 es la unica entrada desde Internet; TLS termina en el ALB. Stack de encender y
  apagar: el ALB cobra por hora.

# Tags: project y env llegan con --tags al desplegar y CloudFormation los propaga.
# Acá cada recurso que lo admite lleva Name (junte-<env>-<recurso>) y layer.
# Necesita network, base, dns (con certificado), back y egress encendido (imagen de Nginx).
# La configuración se sube antes o después: aws s3 sync front-service/ s3://<OpsBucket>/nginx/ --exclude 'tests/*'

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, entrega]
  FrontCount:
    Type: Number
    AllowedValues: [1, 2]
    Default: 1
    Description: 1 = una instancia de Nginx (dev). 2 = una por zona (entrega).
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small]
  NginxImage:
    Type: String
    Default: nginx:1.30.5-alpine
    Description: Misma imagen que infra/docker-compose.dev.yml.
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Conditions:
  TwoFronts: !Equals [!Ref FrontCount, 2]

# Arranque de una instancia de Nginx: replica el servicio nginx del compose local (mismos
# montajes, envsubst de templates/ con las variables NGINX_*). Espera a que la
# configuración esté en S3 (llega por el endpoint de S3) y a que egress esté arriba.
# La zona auth (login y registro) se divide por FrontCount: cada Nginx cuenta por separado y
# así el total entre las instancias queda como con una sola (10r/m y 6 requests de una vez).
# CloudFormation no hace cuentas: con FrontCount en 1 o 2, alcanza con TwoFronts.
Mappings:
  Bootstrap:
    Script:
      Body: |
        #!/bin/bash
        set -euo pipefail
        until dnf install -y docker; do sleep 15; done
        systemctl enable --now docker

        TOKEN=$(curl -s -X PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 300')
        INSTANCE_ID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)

        CONF=/opt/junte/front-service
        mkdir -p "$CONF"
        until aws s3 sync "s3://$OPS_BUCKET/nginx/" "$CONF/" --region "$REGION" --delete --only-show-errors \
          && [ -f "$CONF/nginx.conf" ]; do sleep 30; done
        mkdir -p "$CONF/conf.d" "$CONF/snippets" "$CONF/templates" "$CONF/admin"

        until docker pull "$NGINX_IMAGE"; do sleep 15; done
        docker rm -f nginx 2>/dev/null || true
        docker run -d --name nginx --restart always -p 8080:8080 \
          --log-driver awslogs --log-opt awslogs-region="$REGION" \
          --log-opt awslogs-group="$LOG_GROUP" --log-opt awslogs-stream="nginx-$INSTANCE_ID" \
          -e NGINX_TRUSTED_CIDR="$TRUSTED_CIDR" -e NGINX_RESOLVER=169.254.169.253 \
          -e NGINX_BACKEND="$BACKEND" -e NGINX_ERROR_LOG_LEVEL=crit \
          -e NGINX_AUTH_RATE="$AUTH_RATE" -e NGINX_AUTH_BURST="$AUTH_BURST" \
          -e NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/env.d -e NGINX_ENVSUBST_FILTER='^NGINX_' \
          --tmpfs /etc/nginx/env.d \
          -v "$CONF/nginx.conf:/etc/nginx/nginx.conf:ro" \
          -v "$CONF/conf.d:/etc/nginx/conf.d:ro" \
          -v "$CONF/snippets:/etc/nginx/snippets:ro" \
          -v "$CONF/templates:/etc/nginx/templates:ro" \
          -v "$CONF/admin:/usr/share/nginx/html/admin:ro" \
          "$NGINX_IMAGE"

Resources:
  # ---------------------------------------------------------------- ALB público
  # Única entrada desde Internet. Idle de 300 s para los WebSocket. Sin access logs: guardarían
  # la URL completa, y GET /plans?near= lleva coordenadas (paso 6.1 del plan).

  PublicLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets:
        - { 'Fn::ImportValue': !Sub 'junte-${Env}-PublicSubnetA' }
        - { 'Fn::ImportValue': !Sub 'junte-${Env}-PublicSubnetB' }
      SecurityGroups:
        - { 'Fn::ImportValue': !Sub 'junte-${Env}-AlbSecurityGroup' }
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: '300' }
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }
      Tags:
        - { Key: Name, Value: !Sub 'junte-${Env}-alb' }
        - { Key: layer, Value: borde }

  # /health lo responde Nginx mismo. Sin stickiness (ADR-0003).
  FrontTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: { 'Fn::ImportValue': !Sub 'junte-${Env}-VpcId' }
      Protocol: HTTP
      Port: 8080
      TargetType: instance
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - { Key: stickiness.enabled, Value: 'false' }
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }
      Targets: !If
        - TwoFronts
        - [{ Id: !Ref FrontA, Port: 8080 }, { Id: !Ref FrontB, Port: 8080 }]
        - [{ Id: !Ref FrontA, Port: 8080 }]
      Tags:
        - { Key: Name, Value: !Sub 'junte-${Env}-tg-front' }
        - { Key: layer, Value: borde }

  # Solo 443 (sin listener en el 80): TLS 1.2 y 1.3, termina acá.
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref PublicLoadBalancer
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: { 'Fn::ImportValue': !Sub 'junte-${Env}-ApiCertificateArn' }
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontTargetGroup

  # Alias A: CloudFormation lo actualiza cuando el ALB se recrea, y la URL de la app no cambia.
  ApiRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: { 'Fn::ImportValue': !Sub 'junte-${Env}-HostedZoneId' }
      Name: !Sub
        - 'api.${Zone}'
        - Zone: { 'Fn::ImportValue': !Sub 'junte-${Env}-ZoneName' }
      Type: A
      AliasTarget:
        DNSName: !GetAtt PublicLoadBalancer.DNSName
        HostedZoneId: !GetAtt PublicLoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: false

  # ---------------------------------------------------------------- Instancias de Nginx

  FrontA:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      SubnetId: { 'Fn::ImportValue': !Sub 'junte-${Env}-EdgeSubnetA' }
      SecurityGroupIds:
        - { 'Fn::ImportValue': !Sub 'junte-${Env}-FrontSecurityGroup' }
      IamInstanceProfile: { 'Fn::ImportValue': !Sub 'junte-${Env}-FrontInstanceProfile' }
      MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 1 }
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 8, VolumeType: gp3, Encrypted: true }
      UserData:
        Fn::Base64: !Sub
          - "#!/bin/bash\nREGION='${AWS::Region}' OPS_BUCKET='${OpsBucket}' LOG_GROUP='${LogGroup}' NGINX_IMAGE='${NginxImage}' TRUSTED_CIDR='${VpcCidr}' BACKEND='${InternalAlbDns}:3000' AUTH_RATE='${AuthRate}' AUTH_BURST='${AuthBurst}' bash <<'BOOT'\n${Body}\nBOOT\n"
          - OpsBucket: { 'Fn::ImportValue': !Sub 'junte-${Env}-OpsBucket' }
            LogGroup: { 'Fn::ImportValue': !Sub 'junte-${Env}-NginxLogGroup' }
            VpcCidr: { 'Fn::ImportValue': !Sub 'junte-${Env}-VpcCidr' }
            InternalAlbDns: { 'Fn::ImportValue': !Sub 'junte-${Env}-InternalAlbDns' }
            AuthRate: !If [TwoFronts, '5r/m', '10r/m']
            AuthBurst: !If [TwoFronts, '2', '5']
            Body: !FindInMap [Bootstrap, Script, Body]
      Tags:
        - { Key: Name, Value: !Sub 'junte-${Env}-front-a' }
        - { Key: layer, Value: borde }

  FrontB:
    Type: AWS::EC2::Instance
    Condition: TwoFronts
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      SubnetId: { 'Fn::ImportValue': !Sub 'junte-${Env}-EdgeSubnetB' }
      SecurityGroupIds:
        - { 'Fn::ImportValue': !Sub 'junte-${Env}-FrontSecurityGroup' }
      IamInstanceProfile: { 'Fn::ImportValue': !Sub 'junte-${Env}-FrontInstanceProfile' }
      MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 1 }
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 8, VolumeType: gp3, Encrypted: true }
      UserData:
        Fn::Base64: !Sub
          - "#!/bin/bash\nREGION='${AWS::Region}' OPS_BUCKET='${OpsBucket}' LOG_GROUP='${LogGroup}' NGINX_IMAGE='${NginxImage}' TRUSTED_CIDR='${VpcCidr}' BACKEND='${InternalAlbDns}:3000' AUTH_RATE='${AuthRate}' AUTH_BURST='${AuthBurst}' bash <<'BOOT'\n${Body}\nBOOT\n"
          - OpsBucket: { 'Fn::ImportValue': !Sub 'junte-${Env}-OpsBucket' }
            LogGroup: { 'Fn::ImportValue': !Sub 'junte-${Env}-NginxLogGroup' }
            VpcCidr: { 'Fn::ImportValue': !Sub 'junte-${Env}-VpcCidr' }
            InternalAlbDns: { 'Fn::ImportValue': !Sub 'junte-${Env}-InternalAlbDns' }
            AuthRate: '5r/m'   # FrontB solo existe con TwoFronts
            AuthBurst: '2'
            Body: !FindInMap [Bootstrap, Script, Body]
      Tags:
        - { Key: Name, Value: !Sub 'junte-${Env}-front-b' }
        - { Key: layer, Value: borde }

# Sin export: es el último stack de la cadena.
Outputs:
  ApiUrl:
    Description: URL de la API para EXPO_PUBLIC_API_URL en mobile/eas.json.
    Value: !Sub 'https://${ApiRecord}/api/v1'
  FrontAInstanceId:
    Value: !Ref FrontA
  FrontBInstanceId:
    Condition: TwoFronts
    Value: !Ref FrontB
