AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  junte - MongoDB replica set en EC2 (S1-INF-08; paso 1.6 del plan). 1 o 3 nodos, uno por
  zona, con Docker y la imagen de local y tests, IP privada fija y disco de datos aparte.
  El replica set, los usuarios y el backup los configura task aws:mongo-init (Session Manager).

# Tags: project y env llegan con --tags al desplegar y CloudFormation los propaga.
# Acá cada recurso que lo admite lleva Name (junte-<env>-<recurso>) y layer.
# Necesita los stacks network y base, y egress encendido para bajar Docker y la imagen.
# Después de crearlo: task aws:mongo-init ENV=<env> (rs.initiate con todos los hosts, usuarios, secreto
# mongo-app-uri y backup periódico; scripts en infra/mongo/aws/). El backup no va en el UserData porque
# este corre solo en el primer arranque: así también se instala y se actualiza en nodos existentes.

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, entrega]
  NodeCount:
    Type: Number
    AllowedValues: [1, 3]
    Default: 1
    Description: 1 = replica set de un nodo (dev, mantiene transacciones). 3 = un nodo por zona.
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.micro, t3.small, t3.medium]
  DataVolumeSize:
    Type: Number
    Default: 20
    MinValue: 10
    MaxValue: 100
    Description: GB del disco de datos de cada nodo (gp3).
  MongoImage:
    Type: String
    Default: mongo:9.0.2-noble
    Description: Misma imagen que infra/docker-compose.dev.yml y los tests.
  NodeIpA:
    Type: String
    Default: 10.0.30.10
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}$'
    Description: IP privada fija del nodo de la zona a (dentro de la subred de datos a).
  NodeIpB:
    Type: String
    Default: 10.0.31.10
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}$'
  NodeIpC:
    Type: String
    Default: 10.0.32.10
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}$'
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Ultima Amazon Linux 2023 publicada por AWS (no hay que hardcodear el ID).

Conditions:
  ThreeNodes: !Equals [!Ref NodeCount, 3]

# Arranque de un nodo (solo el primer boot; después fstab y --restart always lo levantan solos).
# Sin set -x: la clave del replica set va de Secrets Manager directo al archivo, nunca al log.
# Reintenta dnf y docker pull hasta que egress esté arriba. Formatea el disco solo si está vacío.
Mappings:
  Bootstrap:
    Script:
      Body: |
        #!/bin/bash
        set -euo pipefail
        until dnf install -y docker; do sleep 15; done
        systemctl enable --now docker

        for i in $(seq 1 60); do [ -e /dev/sdf ] && break; sleep 5; done
        DEV=$(readlink -f /dev/sdf)
        if ! blkid "$DEV" >/dev/null 2>&1; then mkfs.xfs "$DEV"; fi
        mkdir -p /data
        UUID=$(blkid -s UUID -o value "$DEV")
        grep -q "$UUID" /etc/fstab || echo "UUID=$UUID /data xfs defaults,nofail 0 2" >> /etc/fstab
        mount -a
        mkdir -p /data/db /data/configdb
        chown 999:999 /data/db /data/configdb

        umask 077
        aws secretsmanager get-secret-value --region "$REGION" --secret-id "$KEYFILE_SECRET" \
          --query SecretString --output text > /data/keyfile
        chown 999:999 /data/keyfile
        chmod 400 /data/keyfile

        until docker pull "$MONGO_IMAGE"; do sleep 15; done
        docker rm -f mongo 2>/dev/null || true
        docker run -d --name mongo --restart always --network host \
          -v /data/db:/data/db -v /data/configdb:/data/configdb \
          -v /data/keyfile:/etc/mongo/keyfile:ro \
          "$MONGO_IMAGE" --replSet rs0 --bind_ip_all --keyFile /etc/mongo/keyfile

Resources:
  # ---------------------------------------------------------------- Nodo a (siempre)

  DataVolumeA:
    Type: AWS::EC2::Volume
    DeletionPolicy: Snapshot # borrar el stack deja una foto del disco, no pierde la base
    UpdateReplacePolicy: Snapshot
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      Size: !Ref DataVolumeSize
      VolumeType: gp3
      Encrypted: true
      Tags:
        - { Key: Name, Value: !Sub 'junte-${Env}-mongo-data-a' }
        - { Key: layer, Value: datos }

  NodeA:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      SubnetId: { 'Fn::ImportValue': !Sub 'junte-${Env}-DataSubnetA' }
      PrivateIpAddress: !Ref NodeIpA
      SecurityGroupIds:
        - { 'Fn::ImportValue': !Sub 'junte-${Env}-DbSecurityGroup' }
      IamInstanceProfile: { 'Fn::ImportValue': !Sub 'junte-${Env}-DataInstanceProfile' }
      MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 1 }
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 10, VolumeType: gp3, Encrypted: true }
      Volumes:
        - { Device: /dev/sdf, VolumeId: !Ref DataVolumeA }
      UserData:
        Fn::Base64: !Sub
          - "#!/bin/bash\nREGION='${AWS::Region}' KEYFILE_SECRET='${KeyFileSecret}' MONGO_IMAGE='${MongoImage}' bash <<'BOOT'\n${Body}\nBOOT\n"
          - KeyFileSecret: { 'Fn::ImportValue': !Sub 'junte-${Env}-MongoKeyFileSecretArn' }
            Body: !FindInMap [Bootstrap, Script, Body]
      Tags:
        - { Key: Name, Value: !Sub 'junte-${Env}-mongo-a' }
        - { Key: layer, Value: datos }

  # ---------------------------------------------------------------- Nodos b y c (NodeCount=3)

  DataVolumeB:
    Type: AWS::EC2::Volume
    Condition: ThreeNodes
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      AvailabilityZone: !Select [1, !GetAZs '']
      Size: !Ref DataVolumeSize
      VolumeType: gp3
      Encrypted: true
      Tags:
        - { Key: Name, Value: !Sub 'junte-${Env}-mongo-data-b' }
        - { Key: layer, Value: datos }

  NodeB:
    Type: AWS::EC2::Instance
    Condition: ThreeNodes
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      SubnetId: { 'Fn::ImportValue': !Sub 'junte-${Env}-DataSubnetB' }
      PrivateIpAddress: !Ref NodeIpB
      SecurityGroupIds:
        - { 'Fn::ImportValue': !Sub 'junte-${Env}-DbSecurityGroup' }
      IamInstanceProfile: { 'Fn::ImportValue': !Sub 'junte-${Env}-DataInstanceProfile' }
      MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 1 }
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 10, VolumeType: gp3, Encrypted: true }
      Volumes:
        - { Device: /dev/sdf, VolumeId: !Ref DataVolumeB }
      UserData:
        Fn::Base64: !Sub
          - "#!/bin/bash\nREGION='${AWS::Region}' KEYFILE_SECRET='${KeyFileSecret}' MONGO_IMAGE='${MongoImage}' bash <<'BOOT'\n${Body}\nBOOT\n"
          - KeyFileSecret: { 'Fn::ImportValue': !Sub 'junte-${Env}-MongoKeyFileSecretArn' }
            Body: !FindInMap [Bootstrap, Script, Body]
      Tags:
        - { Key: Name, Value: !Sub 'junte-${Env}-mongo-b' }
        - { Key: layer, Value: datos }

  DataVolumeC:
    Type: AWS::EC2::Volume
    Condition: ThreeNodes
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      AvailabilityZone: !Select [2, !GetAZs '']
      Size: !Ref DataVolumeSize
      VolumeType: gp3
      Encrypted: true
      Tags:
        - { Key: Name, Value: !Sub 'junte-${Env}-mongo-data-c' }
        - { Key: layer, Value: datos }

  NodeC:
    Type: AWS::EC2::Instance
    Condition: ThreeNodes
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      SubnetId: { 'Fn::ImportValue': !Sub 'junte-${Env}-DataSubnetC' }
      PrivateIpAddress: !Ref NodeIpC
      SecurityGroupIds:
        - { 'Fn::ImportValue': !Sub 'junte-${Env}-DbSecurityGroup' }
      IamInstanceProfile: { 'Fn::ImportValue': !Sub 'junte-${Env}-DataInstanceProfile' }
      MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 1 }
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 10, VolumeType: gp3, Encrypted: true }
      Volumes:
        - { Device: /dev/sdf, VolumeId: !Ref DataVolumeC }
      UserData:
        Fn::Base64: !Sub
          - "#!/bin/bash\nREGION='${AWS::Region}' KEYFILE_SECRET='${KeyFileSecret}' MONGO_IMAGE='${MongoImage}' bash <<'BOOT'\n${Body}\nBOOT\n"
          - KeyFileSecret: { 'Fn::ImportValue': !Sub 'junte-${Env}-MongoKeyFileSecretArn' }
            Body: !FindInMap [Bootstrap, Script, Body]
      Tags:
        - { Key: Name, Value: !Sub 'junte-${Env}-mongo-c' }
        - { Key: layer, Value: datos }

# Sin export: la URI del back se guarda entera como secreto (mongo-app-uri, lo crea task aws:mongo-init).
Outputs:
  MongoHosts:
    Description: Hosts del replica set rs0, para rs.initiate y para armar mongo-app-uri.
    Value: !If
      - ThreeNodes
      - !Sub '${NodeIpA}:27017,${NodeIpB}:27017,${NodeIpC}:27017'
      - !Sub '${NodeIpA}:27017'
  NodeAInstanceId:
    Description: Para aws ssm start-session --target <id>.
    Value: !Ref NodeA
  NodeBInstanceId:
    Condition: ThreeNodes
    Value: !Ref NodeB
  NodeCInstanceId:
    Condition: ThreeNodes
    Value: !Ref NodeC
