# Rate limiting por IP real ($binary_remote_addr ya pasó por realip). Valores iniciales, a calibrar.
limit_req_zone $binary_remote_addr zone=api:10m  rate=10r/s;
# La zona auth (login y registro) cambia por entorno: está en templates/10-ratelimit-auth.conf.template.
limit_req_status 429;

# Los rechazos quedan en el access log (status 429). En el error log se registran como
# "notice", por debajo del nivel configurado (warn): no se duplica una línea por request
# (y esas líneas incluirían la query string).
limit_req_log_level notice;
