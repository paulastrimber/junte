# Único server del front service: escucha en 8080 (detrás del ALB público en AWS).
server {
  listen 8080 default_server;
  server_name _;

  client_max_body_size 1m;          # las fotos van directo a S3 con URL firmada, no por acá
  absolute_redirect off;            # Location relativo: detrás del ALB, host/puerto/esquema son otros

  # Toda respuesta (incluidos errores y 429) lleva el requestId.
  # Ojo: si una location define su propio add_header, deja de heredar este.
  add_header X-Request-Id $request_id always;

  error_page 429 = @rate_limited;

  # Health del borde: indica que Nginx está vivo, no que el back lo esté.
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Login, registro y contraseñas: zona estricta (fuerza bruta de contraseñas y de códigos de recuperación,
  # altas masivas y emails en masa). Solo estos: refresh, logout y logout-all caen en la zona general de
  # /api/v1/, porque en una universidad muchos estudiantes salen por la misma IP y el refresh automático de
  # la app no debe gastar este cupo.
  # Regex insensible a mayúsculas y con barra final opcional: una variante de la URL (/auth/Login,
  # /auth/login/) no puede caer en la zona general. El back también las rechaza (enrutado estricto).
  # El burst depende del entorno (templates/auth-limit-req.inc.template).
  location ~* ^/api/v1/auth/(login|register|forgot-password|reset-password|change-password)/?$ {
    include /etc/nginx/env.d/auth-limit-req.inc;
    include /etc/nginx/snippets/proxy.conf;
  }

  # Socket.io (solo transporte WebSocket, ADR-0003). Timeouts coherentes con los ALB (300 s).
  location /api/v1/socket.io/ {
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    include /etc/nginx/snippets/proxy.conf;
  }

  location /api/v1/ {
    limit_req zone=api burst=20 nodelay;
    include /etc/nginx/snippets/proxy.conf;
  }

  # Panel de administración (estáticos). La autorización la decide Express, no Nginx.
  location = /admin {
    return 301 /admin/;
  }

  location /admin/ {
    root /usr/share/nginx/html;
    include /etc/nginx/snippets/admin-headers.conf;
    try_files $uri $uri/ /admin/index.html;
  }

  # Todo lo demás (incluido /internal/*, que no se publica) → 404 en el formato de errores.
  location / {
    default_type application/json;
    return 404 '{"code":"NOT_FOUND","message":"Recurso no encontrado","requestId":"$request_id"}';
  }

  # $request_id son 32 caracteres hex generados por Nginx: no puede romper el JSON.
  location @rate_limited {
    default_type application/json;
    return 429 '{"code":"RATE_LIMITED","message":"Demasiadas solicitudes","requestId":"$request_id"}';
  }
}
