# Único server del front service: escucha en 8080 (detrás del ALB público en AWS).
server {
  listen 8080 default_server;
  server_name _;

  client_max_body_size 1m;          # las fotos van directo a S3 con URL firmada, no por acá
  absolute_redirect off;            # Location relativo: detrás del ALB, host/puerto/esquema son otros

  # Toda respuesta (incluidos errores y 429) lleva el requestId.
  # Ojo: si una location define su propio add_header, deja de heredar este.
  add_header X-Request-Id $req_id always;

  error_page 429 = @rate_limited;

  # Health del borde: indica que Nginx está vivo, no que el back lo esté.
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Login, registro y refresh: zona estricta.
  location /api/v1/auth/ {
    limit_req zone=auth burst=5 nodelay;
    include /etc/nginx/snippets/proxy.conf;
  }

  # Socket.io (solo transporte WebSocket, ADR-0003). Timeouts coherentes con los ALB (300 s).
  location /api/v1/socket.io/ {
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    include /etc/nginx/snippets/proxy.conf;
  }

  location /api/v1/ {
    limit_req zone=api burst=20 nodelay;
    include /etc/nginx/snippets/proxy.conf;
  }

  # Panel de administración (estáticos). La autorización la decide Express, no Nginx.
  location = /admin {
    return 301 /admin/;
  }

  location /admin/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /admin/index.html;
  }

  # Todo lo demás (incluido /internal/*, que no se publica) → 404 en el formato de errores.
  location / {
    default_type application/json;
    return 404 '{"code":"NOT_FOUND","message":"Recurso no encontrado","requestId":"$req_id"}';
  }

  # $req_id solo admite [A-Za-z0-9._:-] (ver nginx.conf): no puede romper el JSON.
  location @rate_limited {
    default_type application/json;
    return 429 '{"code":"RATE_LIMITED","message":"Demasiadas solicitudes","requestId":"$req_id"}';
  }
}
