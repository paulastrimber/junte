# junte · front service (Nginx). Ver docs/arquitectura/04-front-service.md.
# Borde sin lógica de negocio: proxy, IP real, rate limit, requestId y estáticos de /admin.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  server_tokens off;            # no exponer la versión de Nginx
  sendfile      on;
  keepalive_timeout 65s;

  # ── requestId ────────────────────────────────────────────────────
  # Si el cliente manda un X-Request-Id con formato seguro se respeta (trazabilidad de punta
  # a punta); si no viene o no es válido, se usa el $request_id que genera Nginx.
  # El formato acotado evita inyectar saltos de línea o basura en logs y headers.
  map $http_x_request_id $req_id {
    "~^[A-Za-z0-9._:-]{1,128}$" $http_x_request_id;
    default                     $request_id;
  }

  # WebSocket: Connection "upgrade" solo si el cliente pidió Upgrade.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Path sin query string para los logs (la query puede traer coordenadas u otros datos).
  map $request_uri $request_path {
    "~^(?<path>[^?]*)" $path;
    default            "";
  }

  # ── Logs ─────────────────────────────────────────────────────────
  # JSON, sin query string, sin Authorization ni cookies, sin bodies, sin referer.
  # $remote_addr ya es la IP real del cliente (ver env.d/00-realip.conf).
  # upstreamPath ($uri) es el path después de la reescritura (/internal/...), también sin query.
  log_format junte escape=json
    '{"time":"$time_iso8601",'
    '"requestId":"$req_id",'
    '"remoteAddr":"$remote_addr",'
    '"method":"$request_method",'
    '"path":"$request_path",'
    '"upstreamPath":"$uri",'
    '"status":$status,'
    '"bytesSent":$body_bytes_sent,'
    '"durationS":$request_time,'
    '"upstreamStatus":"$upstream_status",'
    '"upstreamDurationS":"$upstream_response_time",'
    '"userAgent":"$http_user_agent"}';
  access_log /var/log/nginx/access.log junte;

  # Valores que dependen del entorno (CIDR de confianza, resolver, destino del back).
  # Se generan con envsubst desde front-service/templates/ al arrancar el contenedor.
  include /etc/nginx/env.d/*.conf;

  # Configuración común a todos los entornos.
  include /etc/nginx/conf.d/*.conf;
}
