# Proxy común hacia el back: /api/v1/* → /internal/* (la query string se conserva).
rewrite ^/api/v1/(.*)$ /internal/$1 break;
proxy_pass $backend;

proxy_http_version 1.1;
proxy_set_header Upgrade         $http_upgrade;
proxy_set_header Connection      $connection_upgrade;
proxy_set_header Host            $host;
proxy_set_header X-Request-Id    $request_id;
proxy_set_header X-Real-IP       $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

# El X-Request-Id de la respuesta lo agrega Nginx (nivel server); se oculta el del back
# para no duplicarlo (tiene el mismo valor).
proxy_hide_header X-Request-Id;
proxy_hide_header X-Powered-By;

proxy_connect_timeout 5s;
