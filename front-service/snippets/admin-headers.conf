# Cabeceras del panel /admin (S6-NG-01). Un add_header dentro de una location deja de heredar los del server: por
# eso se repite X-Request-Id.
# CSP: solo recursos propios (el panel no usa CDNs, estilos ni scripts en línea) y llamadas a la misma API. Si un
# texto reportado lograra colarse como HTML, el navegador igual no ejecutaría nada que no venga de /admin/.
add_header X-Request-Id $request_id always;
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Nada del panel queda guardado en el navegador ni en un proxy: siempre la versión vigente.
add_header Cache-Control "no-store" always;
