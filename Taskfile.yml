# Taskfile de junte — https://taskfile.dev
# Uso: `task --list` muestra todos los comandos.
version: '3'

vars:
  COMPOSE: docker compose -f infra/docker-compose.dev.yml
  BACK: back-service
  MOBILE: mobile
  FRONT: front-service

tasks:
  default:
    cmds: [task --list]
    silent: true

  # ── Entorno local ────────────────────────────────────────────────
  setup:
    desc: Instala dependencias de back y app y crea los .env desde .env.example (JWT_SECRET y SEED_PASSWORD aleatorios)
    cmds:
      - test -f {{.BACK}}/.env || cp {{.BACK}}/.env.example {{.BACK}}/.env
      - |
        if grep -q '^JWT_SECRET=$' {{.BACK}}/.env; then
          sed -i.bak "s|^JWT_SECRET=$|JWT_SECRET=$(openssl rand -hex 32)|" {{.BACK}}/.env && rm {{.BACK}}/.env.bak
        fi
      - grep -q '^SEED_PASSWORD=' {{.BACK}}/.env || printf '\nSEED_PASSWORD=\n' >> {{.BACK}}/.env
      - |
        if grep -q '^SEED_PASSWORD=$' {{.BACK}}/.env; then
          sed -i.bak "s|^SEED_PASSWORD=$|SEED_PASSWORD=$(openssl rand -hex 12)|" {{.BACK}}/.env && rm {{.BACK}}/.env.bak
        fi
      - test -f {{.MOBILE}}/.env || cp {{.MOBILE}}/.env.example {{.MOBILE}}/.env
      - npm ci --prefix {{.BACK}}
      - npm ci --prefix {{.MOBILE}}

  up:
    desc: Levanta Nginx, back, MongoDB (replica set 1 nodo) y Redis y espera a que estén healthy
    cmds: ['{{.COMPOSE}} up -d --build --wait']

  down:
    desc: Detiene el entorno local (también la segunda instancia del back, si se levantó)
    cmds: ['{{.COMPOSE}} --profile scale down']

  reset:
    desc: Detiene y BORRA los datos locales, luego levanta, migra y siembra
    prompt: Esto borra la base local. ¿Continuar?
    cmds:
      - '{{.COMPOSE}} --profile scale down -v'
      - task: up
      - task: db:migrate
      - task: db:seed

  logs:
    desc: 'Logs del entorno (ej: task logs -- back)'
    cmds: ['{{.COMPOSE}} logs -f {{.CLI_ARGS}}']

  # ── Back service ─────────────────────────────────────────────────
  back:dev:
    desc: Back en modo desarrollo fuera de docker
    dir: '{{.BACK}}'
    cmds: [npm run dev]

  back:test:
    desc: Tests del back (unitarios, integración, contrato)
    dir: '{{.BACK}}'
    cmds: [npm test]

  back:test:watch:
    desc: Tests del back en modo watch
    dir: '{{.BACK}}'
    cmds: [npm run test:watch]

  back:lint:
    desc: Lint del back
    dir: '{{.BACK}}'
    cmds: [npm run lint]

  chat:two-instances:
    desc: Levanta una segunda instancia del back y comprueba que un mensaje del chat llega de una a la otra (S5-BE-05)
    cmds:
      - '{{.COMPOSE}} --profile scale up -d --build --wait back-2'
      - node {{.BACK}}/scripts/chat-two-instances.js http://localhost:3000 http://localhost:3001

  # ── Base de datos (migrate-mongo) ────────────────────────────────
  db:migrate:
    desc: Aplica las migraciones pendientes
    dir: '{{.BACK}}'
    cmds: [npx migrate-mongo up]

  db:migrate:down:
    desc: Revierte la ÚLTIMA migración aplicada
    dir: '{{.BACK}}'
    prompt: Se va a revertir la última migración. ¿Continuar?
    cmds: [npx migrate-mongo down]

  db:migrate:status:
    desc: Muestra migraciones aplicadas y pendientes
    dir: '{{.BACK}}'
    cmds: [npx migrate-mongo status]

  db:migrate:create:
    desc: 'Crea una migración (ej: task db:migrate:create -- add-plan-interests)'
    dir: '{{.BACK}}'
    requires:
      vars: [CLI_ARGS]
    cmds: ['npx migrate-mongo create {{.CLI_ARGS}}']

  db:migrate:check:
    desc: up → down → up (lo mismo que corre CI)
    dir: '{{.BACK}}'
    cmds: [npm run migrate:check]

  db:seed:
    desc: Carga datos de desarrollo (solo local)
    dir: '{{.BACK}}'
    preconditions:
      - sh: '[ "$NODE_ENV" != "production" ]'
        msg: Los seeds no se corren en producción
    cmds: [npm run seed]

  db:admin:
    desc: 'Cuentas admin sin pasar por la API (ej: task db:admin -- promote ana@um.edu.uy). create toma la contraseña de ADMIN_PASSWORD'
    dir: '{{.BACK}}'
    requires:
      vars: [CLI_ARGS]
    cmds: ['npm run admin -- {{.CLI_ARGS}}']

  db:catalogs:sync:
    desc: Suma a la base las entradas nuevas de back-service/catalogs/ (solo inserta; nunca pisa lo que editó el admin)
    dir: '{{.BACK}}'
    cmds: [npm run catalogs:sync]

  # ── Front service (Nginx) ────────────────────────────────────────
  front:check:
    desc: Valida la configuración de Nginx
    cmds: ['{{.COMPOSE}} run --rm --no-deps nginx nginx -t']

  front:smoke:
    desc: Smoke test del front contra el entorno local
    cmds: ['bash {{.FRONT}}/tests/smoke.sh http://localhost:8080']

  # ── Infra (CloudFormation) ───────────────────────────────────────
  infra:lint:
    desc: cfn-lint de infra/templates y shellcheck de los scripts de AWS (en Docker, mismas versiones que CI; sin credenciales de AWS)
    cmds:
      - >-
        docker run --rm -v "$PWD/infra:/infra:ro" -w /infra python:3.13.15-slim
        sh -c 'pip install -q --disable-pip-version-check --root-user-action=ignore cfn-lint==1.57.0
        && cfn-lint --regions us-east-1 -- templates/*.yml'
      - docker run --rm -v "$PWD/infra:/infra:ro" koalaman/shellcheck:v0.11.0 -s bash /infra/scripts/aws.sh /infra/mongo/aws/init-replica-set.sh /infra/mongo/aws/create-app-uri.sh /infra/mongo/aws/verify-replica-set.sh /infra/mongo/aws/install-backup.sh /infra/mongo/aws/migrate.sh

  # ── AWS (despliegue) ─────────────────────────────────────────────
  # ENV=dev (cuenta A, perfil junte-dev) o ENV=entrega (cuenta B, perfil junte-entrega).
  # Piden confirmación antes de crear o borrar (YES=1 la omite). Ver docs/infra/plan-aws.md.
  aws:up:
    desc: 'Enciende la sesión en AWS: egress, redis, back y front (cobran por hora)'
    vars: { ENV: '{{.ENV | default "dev"}}' }
    cmds: ['bash infra/scripts/aws.sh up {{.ENV}}']

  aws:down:
    desc: Apaga la sesión (front, back, redis, egress) y verifica que no quede nada cobrando
    vars: { ENV: '{{.ENV | default "dev"}}' }
    cmds: ['bash infra/scripts/aws.sh down {{.ENV}}']

  aws:status:
    desc: Qué stacks existen, qué cobra por hora y si la API responde
    vars: { ENV: '{{.ENV | default "dev"}}' }
    cmds: ['bash infra/scripts/aws.sh status {{.ENV}}']

  aws:deploy:
    desc: 'Un solo stack con change set y confirmación (STACK=network|base|dns|mongo|egress|redis|back|front, PARAMS="Clave=Valor ...")'
    vars: { ENV: '{{.ENV | default "dev"}}' }
    requires: { vars: [STACK] }
    cmds: ['bash infra/scripts/aws.sh deploy {{.ENV}} {{.STACK}} {{.PARAMS}}']

  back:release:
    desc: Construye la imagen del back (linux/amd64), la sube a ECR, migra y actualiza las instancias de a una
    vars: { ENV: '{{.ENV | default "dev"}}' }
    cmds: ['bash infra/scripts/aws.sh release {{.ENV}}']

  aws:mongo-init:
    desc: 'MongoDB en AWS: replica set (1 o 3 nodos), usuarios, secreto mongo-app-uri y backup cada hora (se puede repetir)'
    vars: { ENV: '{{.ENV | default "dev"}}' }
    cmds: ['bash infra/scripts/aws.sh mongo-init {{.ENV}}']

  aws:migrate:
    desc: Migraciones y catálogos desde una instancia del back, con el usuario de migraciones (TAG=<imagen> opcional)
    vars: { ENV: '{{.ENV | default "dev"}}' }
    cmds: ['bash infra/scripts/aws.sh migrate {{.ENV}} {{.TAG}}']

  aws:backup:
    desc: Dispara ahora un backup de MongoDB a s3://<OpsBucket>/backups/ y muestra los últimos
    vars: { ENV: '{{.ENV | default "dev"}}' }
    cmds: ['bash infra/scripts/aws.sh backup {{.ENV}}']

  # ── App móvil ────────────────────────────────────────────────────
  mobile:start:
    desc: Inicia Expo (development build)
    dir: '{{.MOBILE}}'
    cmds: [npx expo start --dev-client]

  mobile:test:
    desc: Tests de la app
    dir: '{{.MOBILE}}'
    cmds: [npm test]

  mobile:lint:
    desc: Lint de la app
    dir: '{{.MOBILE}}'
    cmds: [npm run lint]

  mobile:build:dev:
    desc: Development build Android (EAS)
    dir: '{{.MOBILE}}'
    cmds: [npx eas build --profile development --platform android]

  mobile:build:apk:
    desc: APK de entrega (EAS, perfil production con buildType apk)
    dir: '{{.MOBILE}}'
    cmds: [npx eas build --profile production --platform android]

  # ── Calidad ──────────────────────────────────────────────────────
  lint:
    desc: Lint de todo
    cmds:
      - task: back:lint
      - task: mobile:lint

  test:
    desc: Tests de todo
    cmds:
      - task: back:test
      - task: mobile:test

  ci:
    desc: Lo mismo que CI — correr antes de abrir un PR
    cmds:
      - task: lint
      - task: test
      - task: db:migrate:check
      - task: front:check
      - task: infra:lint
